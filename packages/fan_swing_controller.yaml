switch:
  - platform: template
    switches:
      zhimi_sg_508136115_horizontal_swing:
        friendly_name: "循環扇 1 左右擺動"
        value_template: "{{ state_attr('fan.zhimi_sg_508136115_fb1_s_2_fan', 'oscillating') }}"
        turn_on:
          service: fan.oscillate
          data:
            entity_id: fan.zhimi_sg_508136115_fb1_s_2_fan
            oscillating: true
        turn_off:
          service: fan.oscillate
          data:
            entity_id: fan.zhimi_sg_508136115_fb1_s_2_fan
            oscillating: false

      zhimi_sg_507844080_horizontal_swing:
