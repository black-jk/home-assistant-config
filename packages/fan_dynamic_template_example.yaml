# /packages/fan_control.yaml:
#
#  [範例]
#  [虛擬開關]
#    - 綁定 service: fan.oscillate
#    - 可用一組 UI 控制多台風扇
#

input_text:
  current_fan_id:
    name: 當前控制風扇
    initial: "507844080"

template:
  - switch:
      - name: "動態風扇 左右擺動"
        unique_id: dynamic_fan_horizontal_swing
        icon: mdi:swap-horizontal
        turn_on:
          service: fan.oscillate
          target:
            entity_id: >
              fan.zhimi_sg_{{ states('input_text.current_fan_id') }}_fb1_s_2_fan
          data:
            oscillating: true
        turn_off:
          service: fan.oscillate
          target:
            entity_id: >
              fan.zhimi_sg_{{ states('input_text.current_fan_id') }}_fb1_s_2_fan
          data:
            oscillating: false
        state: >
          {{ state_attr('fan.zhimi_sg_' ~ states('input_text.current_fan_id') ~ '_fb1_s_2_fan', 'oscillating') }}


