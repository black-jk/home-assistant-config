'1':
  alias: 調整電扇 - JK
  description: ''
  sequence:
  - if:
    - condition: state
      entity_id: fan.zhimi_sg_507844080_fb1_s_2_fan
      state: 'off'
    then:
    - action: fan.turn_on
      data: {}
      target:
        entity_id: fan.zhimi_sg_507844080_fb1_s_2_fan
    - delay:
        hours: 0
        minutes: 0
        seconds: 2
        milliseconds: 0
  - action: switch.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: switch.zhimi_sg_507844080_fb1_one_key_back_p_5_9
  - delay:
      hours: 0
      minutes: 0
      seconds: 2
      milliseconds: 0
  - if:
    - condition: state
      entity_id: switch.zhimi_sg_507844080_fb1_h_swing_back_p_5_4
      state: 'on'
    then:
    - wait_for_trigger:
      - trigger: state
        entity_id:
        - switch.zhimi_sg_507844080_fb1_h_swing_back_p_5_4
        from:
        to: 'off'
        enabled: true
      timeout:
        hours: 0
        minutes: 0
        seconds: 15
        milliseconds: 0
  - repeat:
      count: 3
      sequence:
      - action: text.set_value
        continue_on_error: true
        metadata: {}
        data:
          value: right
        target:
          entity_id: text.zhimi_sg_507844080_fb1_h_swing_step_move_p_5_6
      - delay:
          hours: 0
          minutes: 0
          seconds: 2
          milliseconds: 0
  - type: set_value
    domain: number
    continue_on_error: true
    device_id: 35f18479e0bac6cec03a3445457ae5e3
    entity_id: 6accae6c1d9091ea586ee136d45d4a78
    value: 65
    enabled: false
  - action: number.set_value
    continue_on_error: true
    metadata: {}
    target:
      entity_id: number.zhimi_sg_507844080_fb1_stepless_fan_level_p_5_10
    data:
      value: '{{ 75 if states(''sensor.esp_sensor_1_temperature'') | float > 27 else
        50 }}'
