- id: '1744800921110'
  alias: ESP 異常推播通知
  description: ''
  triggers:
  - minutes: /5
    trigger: time_pattern
  conditions:
  - condition: template
    value_template: "{% set wifi1 = states('sensor.esp_sensor_1_wifi_signal') | float(-100)
      %} {% set wifi2 = states('sensor.esp_controller_1_wifi_signal') | float(-100)
      %} {% set up1 = states('sensor.esp_sensor_1_uptime') | int(0) %} {% set up2
      = states('sensor.esp_controller_1_uptime') | int(0) %} {% set any_unavailable
      = [\n  'sensor.esp_sensor_1_wifi_signal',\n  'sensor.esp_controller_1_wifi_signal'\n]
      | select('in', ['unknown', 'unavailable', 'none']) | list | count > 0 %} {{
      wifi1 < -70 or wifi2 < -70 or up1 < 60 or up2 < 60 or any_unavailable }}\n"
  actions:
  - action: notify.mobile_app_asus_i006d
    data:
      title: ESP 設備異常
      message: "{% set wifi1 = states('sensor.esp_sensor_1_wifi_signal') | float(-100)
        %} {% set wifi2 = states('sensor.esp_controller_1_wifi_signal') | float(-100)
        %} {% set up1 = states('sensor.esp_sensor_1_uptime') | int(0) %} {% set up2
        = states('sensor.esp_controller_1_uptime') | int(0) %}\n{% set alerts = []
        %} {% if wifi1 < -70 %} {% set alerts = alerts + ['\U0001F4F6 Sensor 1 Wi-Fi
        訊號弱'] %} {% endif %} {% if wifi2 < -70 %} {% set alerts = alerts + ['\U0001F4F6
        Controller 1 Wi-Fi 訊號弱'] %} {% endif %} {% if up1 < 60 %} {% set alerts =
        alerts + ['⏱️ Sensor 1 剛剛重啟'] %} {% endif %} {% if up2 < 60 %} {% set alerts
        = alerts + ['⏱️ Controller 1 剛剛重啟'] %} {% endif %} {% if states('sensor.esp_sensor_1_wifi_signal')
        in ['unknown', 'unavailable', 'none'] %}\n  {% set alerts = alerts + ['❌ Sensor
        1 無法取得 Wi-Fi'] %}\n{% endif %} {% if states('sensor.esp_controller_1_wifi_signal')
        in ['unknown', 'unavailable', 'none'] %}\n  {% set alerts = alerts + ['❌ Controller
        1 無法取得 Wi-Fi'] %}\n{% endif %} {{ alerts | join(', ') }}\n"
  mode: single
- id: '1744811688959'
  alias: '[AUTO] 離家 - 記錄狀態變更'
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.composite_location_state_jk
    for:
      hours: 0
      minutes: 0
      seconds: 0
  - trigger: state
    entity_id:
    - sensor.composite_location_state_test
    for:
      hours: 0
      minutes: 0
      seconds: 0
    enabled: false
  conditions:
  - condition: template
    value_template: '{% set from = trigger.from_state.state if trigger is defined
      else ''離家'' %}

      {% set to = trigger.to_state.state if trigger is defined else ''在家'' %}

      {{ from in [''在家'', ''離家'', ''幼兒園'', ''公司''] and to in [''在家'', ''離家'', ''幼兒園'',
      ''公司''] }}'
    enabled: false
  - condition: template
    value_template: '{% set from = trigger.from_state.state if trigger is defined
      else ''在家'' %}

      {% set to   = trigger.to_state.state   if trigger is defined else ''離家'' %}

      {{ from in [''在家'', ''離家'', ''幼兒園'', ''公司''] and to in [''在家'', ''離家'', ''幼兒園'',
      ''公司''] }}'
    enabled: true
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.jk_not_at_home
      state: 'off'
    - condition: template
      value_template: '{% set to = trigger.to_state.state if trigger is defined else
        ''離家'' %}

        {{ to not in [''在家''] }}'
      enabled: true
    then:
    - action: input_boolean.turn_on
      continue_on_error: true
      target:
        entity_id: input_boolean.jk_not_at_home
      data: {}
    - action: input_datetime.set_datetime
      continue_on_error: true
      metadata: {}
      target:
        entity_id: input_datetime.jk_leave_home_at
      data:
        datetime: '{{ now().isoformat() }}'
  - type: notify
    domain: mobile_app
    continue_on_error: true
    device_id: 47a779ad63edb5bb026f8229aa7831de
    title: '{{ now().timestamp() | timestamp_custom(''%H:%M:%S'') }} 離家'
    message: '{% set from = trigger.from_state.state if trigger is defined else ''離家''
      %}

      {% set to = trigger.to_state.state if trigger is defined else ''在家'' %}

      位置變更: {{ from }} -> {{to }}

      '
  mode: single
