- id: '1744257648253'
  alias: '[AUTO] 到家 - 開客廳燈、開房間電扇'
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.composite_location_state_jk
  - trigger: state
    entity_id:
    - sensor.composite_location_state_test
    for:
      hours: 0
      minutes: 0
      seconds: 5
    enabled: false
  conditions:
  - condition: state
    entity_id: input_boolean.jk_not_at_home
    state: 'on'
  - condition: template
    value_template: '{% set from = trigger.from_state.state if trigger is defined
      else ''離家'' %}

      {% set to = trigger.to_state.state if trigger is defined else ''在家'' %}

      {{ from in [''在家'', ''離家'', ''幼兒園'', ''公司''] and to in [''在家''] }}'
    enabled: true
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id:
      - input_boolean.jk_not_at_home
    data: {}
    enabled: true
  - parallel:
    - action: alarm_control_panel.alarm_disarm
      continue_on_error: true
      metadata: {}
      data:
        code: '3652'
      target:
        entity_id: alarm_control_panel.virtual_home_alarm
    - if:
      - condition: time
        after: 08:00:00
        before: '20:30:00'
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
        - sun
      then:
      - action: light.turn_on
        continue_on_error: true
        metadata: {}
        data:
          brightness_pct: 85
          color_temp_kelvin: 5500
        target:
          entity_id: light.yeelink_sg_594192509_ceiling22_s_2_light
    - if:
      - condition: or
        conditions:
        - condition: numeric_state
          entity_id: sensor.esp_sensor_1_temperature
          above: 25
        - condition: state
          entity_id: sensor.esp_sensor_1_temperature
          state: unavailable
      then:
      - if:
        - condition: state
          entity_id: fan.zhimi_sg_507844080_fb1_s_2_fan
          state: 'off'
        then:
        - action: input_text.set_value
          continue_on_error: true
          metadata: {}
          data:
            value: seat
          target:
            entity_id: input_text.current_fan_mode
    - type: notify
      domain: mobile_app
      continue_on_error: true
      device_id: 47a779ad63edb5bb026f8229aa7831de
      title: '{{ now().timestamp() | timestamp_custom(''%H:%M:%S'') }} 到家'
      message: 歡迎回家
    enabled: true
  - type: notify
    domain: mobile_app
    continue_on_error: true
    device_id: 47a779ad63edb5bb026f8229aa7831de
    title: '{{ now().timestamp() | timestamp_custom(''%H:%M:%S'') }} 到家'
    message: 歡迎回家 (測試)
    enabled: false
  mode: single
