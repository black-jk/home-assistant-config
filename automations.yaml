- id: '1744524619281'
  alias: '測試: 進入 「家 - 附近」'
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - input_number.test_number_01
    for:
      hours: 0
      minutes: 0
      seconds: 5
    above: 50
    below: 300
    enabled: false
  - trigger: numeric_state
    entity_id:
    - sensor.jia_blackjk_z8_distance
    above: 50
    below: 300
    enabled: true
  conditions:
  - condition: template
    value_template: '{{ states(''input_text.jk_wei_zhi_zhuang_tai'') == ''離開家附近''
      }}'
  actions:
  - action: input_text.set_value
    metadata: {}
    data:
      value: 到達家附近
    target:
      entity_id: input_text.jk_wei_zhi_zhuang_tai
  - if:
    - condition: numeric_state
      entity_id: sensor.esp_sensor_1_temperature
      above: 25
    then:
    - device_id: 47a779ad63edb5bb026f8229aa7831de
      domain: mobile_app
      type: notify
      enabled: true
      message: '{{ ''房間溫度: '' }}{{ states(''sensor.esp_sensor_1_temperature'') }}
        {{ "°c，建議先開啟冷氣" }}'
      title: '{{ now().timestamp() | timestamp_custom(''%H:%M:%S'') }} 到達家附近'
    else:
    - device_id: 47a779ad63edb5bb026f8229aa7831de
      domain: mobile_app
      type: notify
      enabled: true
      message: 歡迎回家
      title: '{{ now().timestamp() | timestamp_custom(''%H:%M:%S'') }} 到達家附近'
  mode: single
- id: '1744609746869'
  alias: 封存 _ [通知] 地點變更
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - device_tracker.asus_i006d
    from:
    to:
  conditions:
  - condition: and
    conditions:
    - condition: template
      value_template: '{% set from = trigger.from_state.state if trigger is defined
        else ''home'' %}

        {% set to   = trigger.to_state.state   if trigger is defined else ''not_home''
        %}

        {{ from in [''home'', ''not_home'', ''幼兒園'', ''公司''] and to in [''home'',
        ''not_home'', ''幼兒園'', ''公司''] }}'
  actions:
  - device_id: 47a779ad63edb5bb026f8229aa7831de
    domain: mobile_app
    type: notify
    enabled: true
    message: "{% set from = trigger.from_state.state if trigger is defined and trigger.from_state
      is defined else 'not_home' %} {% set from = '在家' if from == 'home' else from
      %} {% set from = '離家' if from == 'not_home' else from %}\n{% set to = states('device_tracker.asus_i006d')
      | default('未知') %} {% set to = '在家' if to == 'home' else to %} {% set to = '離家'
      if to == 'not_home' else to %}\n{% if to == '在家' %}\n  {{ from }} -> 到家\n{%
      elif to == '離家' %}\n  {{ from }} -> 離家\n{% else %}\n  到達 {{ to }}\n{% endif
      %}\n"
    title: '{{ now().timestamp() | timestamp_custom(''%H:%M:%S'') }} 地點變更'
  mode: single
