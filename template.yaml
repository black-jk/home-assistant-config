# /template.yaml:

# ----------------------------------------------------------------------------------------------------
#  [虛擬 Sensor]
#    - 結合 device_tracker + WiFi connection
# ----------------------------------------------------------------------------------------------------

- sensor:
    - name: "Composite Location State (Source of JK)"
      unique_id: composite_location_state_src_jk
      state: >
        {% set device_tracker_state = states('device_tracker.asus_i006d') %}
        {% set wifi_connection_state = states('sensor.asus_i006d_wi_fi_connection') %}

        {% if wifi_connection_state in ['JK-Home'] or device_tracker_state in ['home']%}
          在家
        {% elif wifi_connection_state in ['HD', 'HD_AP1'] or device_tracker_state in ['公司']%}
          公司
        {% elif device_tracker_state in ['幼兒園', '公司']%}
          {{ device_tracker_state }}
        {% elif device_tracker_state in ['not_home']%}
          離家
        {% else %}
          不可用
        {% endif %}

# --------------------------------------------------
#  [虛擬 Sensor]
#    - 過濾無效的狀態
#    - 遇到無效的狀態時回傳上一次的結果
# --------------------------------------------------

- trigger:
    - platform: state
      entity_id: sensor.composite_location_state_source_of_jk
  sensor:
    - name: "Composite Location State (JK)"
      unique_id: composite_location_state_jk
      state: >
        {% set previous = trigger.from_state.state if trigger is defined else '初始' %}
        {% set to       = trigger.to_state.state   if trigger is defined else '未知' %}
        {% if to in ['在家', '離家', '幼兒園', '公司'] %}
          {{ to }}
        {% else %}
          {{ previous }}
        {% endif %}

# --------------------------------------------------
#  [測試]
# --------------------------------------------------

- sensor:
    - name: "Composite Location State (Source of TEST)"
      unique_id: composite_location_state_src_test
