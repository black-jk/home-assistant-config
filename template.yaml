# ----------------------------------------------------------------------------------------------------
#  [虛擬 Sensor]
#    - 回傳可讀性較好的 uptime  (秒 --> 天/時/分/秒)
# ----------------------------------------------------------------------------------------------------

- sensor:
    - name: "esp-sensor-1 - Uptime Pretty"
      unique_id: esp_sensor_1_uptime_pretty
      state: >
        {% set raw = states('sensor.esp_sensor_1_uptime') %}
        {% if raw in ['unknown', 'unavailable', 'None'] %}
          不可用
        {% else %}
          {% set seconds = raw | int(0) %}
          {% set days = (seconds // 86400) %}
          {% set hours = (seconds % 86400) // 3600 %}
          {% set minutes = (seconds % 3600) // 60 %}
          {% set secs = seconds % 60 %}
          {% set parts = [] %}
          {% if days > 0 %} {% set parts = parts + [days ~ '天'] %} {% endif %}
          {% if hours > 0 %} {% set parts = parts + [hours ~ '小時'] %} {% endif %}
          {% if minutes > 0 %} {% set parts = parts + [minutes ~ '分'] %} {% endif %}
          {% if secs > 0 and days == 0 %} {% set parts = parts + [secs ~ '秒'] %} {% endif %}
          {{ parts | join(' ') if parts else '剛啟動' }}
        {% endif %}

# --------------------------------------------------

- sensor:
    - name: "esp-controller-1 - Uptime Pretty"
      unique_id: esp_controller_1_uptime_pretty
      state: >
        {% set raw = states('sensor.esp_controller_1_uptime') %}
        {% if raw in ['unknown', 'unavailable', 'None'] %}
          不可用
        {% else %}
          {% set seconds = raw | int(0) %}
          {% set days = (seconds // 86400) %}
          {% set hours = (seconds % 86400) // 3600 %}
          {% set minutes = (seconds % 3600) // 60 %}
          {% set secs = seconds % 60 %}
          {% set parts = [] %}
          {% if days > 0 %} {% set parts = parts + [days ~ '天'] %} {% endif %}
          {% if hours > 0 %} {% set parts = parts + [hours ~ '小時'] %} {% endif %}
          {% if minutes > 0 %} {% set parts = parts + [minutes ~ '分'] %} {% endif %}
          {% if secs > 0 and days == 0 %} {% set parts = parts + [secs ~ '秒'] %} {% endif %}
          {{ parts | join(' ') if parts else '剛啟動' }}
        {% endif %}



